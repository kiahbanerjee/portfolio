<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play — Kiah Banerjee</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="archive.css">
    <link rel="stylesheet" href="https://use.typekit.net/ieb3fys.css">
</head>
<body>

    <nav class="main-nav">
        <a href="index.html" class="nav-home">Kiah Banerjee</a>
        <div class="nav-right">
            <a href="archive.html">Play</a>
            <a href="cv.html">CV</a>
        </div>
    </nav>

    <img id="archive-preview" class="archive-preview" src="" alt="">

    <main class="archive-page" id="archive-page">
        <div class="archive-inner" id="archive-inner">

            <div class="archive-track">
                <img src="archive/niw.png" alt="">
                <img src="archive/Volume control-1.png" alt="">
                <img src="archive/bday-1.png" alt="">
                <img src="archive/din.png" alt="">
                <img src="archive/love-1.png" alt="">
                <img src="archive/dp-1.png" alt="">
                <img src="archive/lamp-1.png" alt="">
                <img src="archive/co-1.png" alt="">
                <img src="archive/etching.jpg" alt="">
            </div>

        </div>
    </main>

    <script>
        document.querySelector('.nav-home').addEventListener('click', () => {
            sessionStorage.setItem('skipIntro', '1');
        });

        const page = document.getElementById('archive-page');
        const inner = document.getElementById('archive-inner');
        const original = document.querySelector('.archive-track');

        const preview = document.getElementById('archive-preview');

        inner.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'IMG') {
                preview.src = e.target.src;
                preview.classList.add('visible');
            }
        });

        inner.addEventListener('mouseout', (e) => {
            if (e.target.tagName === 'IMG') {
                preview.classList.remove('visible');
            }
        });

        window.addEventListener('load', () => {
            const trackH = original.offsetHeight;

            // Clone until content is at least 8x the viewport height
            while (inner.scrollHeight < window.innerHeight * 8) {
                const clone = original.cloneNode(true);
                clone.setAttribute('aria-hidden', 'true');
                inner.appendChild(clone);
            }

            // Start one track-height from the top so scrolling up works too
            page.scrollTop = trackH;

            page.addEventListener('scroll', () => {
                const maxScroll = page.scrollHeight - page.clientHeight;
                if (page.scrollTop <= 0) {
                    page.scrollTop += trackH;
                } else if (page.scrollTop >= maxScroll - trackH) {
                    page.scrollTop -= trackH;
                }
            });
        });
    </script>
</body>
</html>
